name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，且不打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Reports every malformed article at once, with file and line numbers,
      # instead of failing on the first one during the build.
      - name: Check content format
        run: bun run content:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build static site
        run: bun run build:pages

      # Asserts the things that silently break a Pages deploy: asset prefix,
      # injected router basename, production React, and the 404 fallback.
      - name: Verify build output
        run: bun run verify:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site if the repository does not have one yet,
          # which is otherwise a "Get Pages site failed / Not Found" error.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
